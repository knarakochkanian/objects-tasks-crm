project_id = "objects-tasks-crm"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[db.pooler]
enabled = false
port = 55429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false

[studio]
enabled = false
port = 55423
api_url = "http://127.0.0.1"

[inbucket]
enabled = false
port = 55424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

# CLI v2: this enables the email provider (including login).
# Public registration is blocked by auth.enable_signup = false above.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

# Higher limits only for repeated local integration/browser tests.
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000
